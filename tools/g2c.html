<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Geodetic to Cartesian</title>
    <script>
        window.MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$']], processEscapes: true },
            options: { skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code'] }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <link rel="stylesheet" href="../css/eng-hub.css">
</head>
<body class="tool-page">
    <h1>Geodetic → Cartesian Converter</h1>

    <div class="config-panel">
        <label>Reference Ellipsoid</label>
        <select id="ellipsoidSelect">
            <option value="WGS84">WGS 84</option>
            <option value="GRS80">GRS 80</option>
            <option value="CLARKE1866">Clarke 1866</option>
            <option value="KRASSOVSKY">Krassovsky 1940</option>
        </select>
    </div>

    <div class="panel">
        <label>Latitude [Φ] (degrees)</label>
        <input type="number" id="gRho" value="0">
        <label>Longitude [λ] (degrees)</label>
        <input type="number" id="gLambda" value="45">
        <label>Height [h] (meters)</label>
        <input type="number" id="gH" value="0">
        <button onclick="convertG2C()">Convert to Cartesian</button>
    </div>

    <div class="output-panel" id="outputSection" style="display: none;">
        <div id="finalResult"></div>
        <div id="explanationText"></div>
    </div>

    <script>
        const ellipsoids = { "WGS84": { a: 6378137.0, invF: 298.257223563 }, "GRS80": { a: 6378137.0, invF: 298.257222101 }, "CLARKE1866": { a: 6378206.4, b: 6356583.8 }, "KRASSOVSKY": { a: 6378245.0, invF: 298.3 } };

        function getEllipsoidParams() {
            const key = document.getElementById('ellipsoidSelect').value;
            const e = ellipsoids[key];
            const a = e.a;
            let f, b;
            if (e.b) { b = e.b; f = (a - b) / a; } else { f = 1 / e.invF; b = a * (1 - f); }
            const e2 = 2 * f - (f * f);
            return { a, e2 };
        }

        function toRad(deg) { return deg * Math.PI / 180.0; }

        function convertG2C() {
            const phiDeg = parseFloat(document.getElementById('gRho').value);
            const lamDeg = parseFloat(document.getElementById('gLambda').value);
            const h = parseFloat(document.getElementById('gH').value);
            const params = getEllipsoidParams();
            const {a, e2, name} = params;

            let log = [];

            log.push(`<div class="step-container"><div class="step-title">Step 1: Convert Angles to Radians</div><p>Convert latitude and longitude from degrees to radians for trigonometric calculations:</p>$$ \\phi = ${phiDeg}^\\circ \\times \\frac{\\pi}{180} = ${toRad(phiDeg).toFixed(6)}\\text{ radians} $$$$ \\lambda = ${lamDeg}^\\circ \\times \\frac{\\pi}{180} = ${toRad(lamDeg).toFixed(6)}\\text{ radians} $$<p><em>Reason: Trigonometric functions in programming typically use radians, not degrees.</em></p></div>`);

            const phi = toRad(phiDeg);
            const lam = toRad(lamDeg);

            log.push(`<div class="step-container"><div class="step-title">Step 2: Calculate Radius of Curvature (N)</div><p>Calculate the prime vertical radius of curvature at this latitude:</p>$$ N = \\frac{a}{\\sqrt{1 - e^2 \\cdot \\sin^2\\phi}} = \\frac{${a}}{\\sqrt{1 - ${e2.toFixed(6)} \\cdot \\sin^2${phiDeg}^\\circ}} $$`);

            const N = a / Math.sqrt(1 - e2 * Math.sin(phi) * Math.sin(phi));
            log.push(`$$ N = ${N.toFixed(3)}\\text{ meters} $$<p><em>Reason: N represents how curved the Earth is at this latitude, needed to account for ellipsoidal shape.</em></p></div>`);

            log.push(`<div class="step-container"><div class="step-title">Step 3: Calculate X Coordinate</div><p>X coordinate is the east-west position:</p>$$ X = (N + h) \\cdot \\cos\\phi \\cdot \\cos\\lambda = (${N.toFixed(3)} + ${h}) \\cdot \\cos${phiDeg}^\\circ \\cdot \\cos${lamDeg}^\\circ $$`);

            const X = (N + h) * Math.cos(phi) * Math.cos(lam);
            log.push(`$$ X = ${X.toFixed(3)}\\text{ meters} $$<p><em>Reason: X represents the distance east of the prime meridian, scaled by the Earth's curvature and height.</em></p></div>`);

            log.push(`<div class="step-container"><div class="step-title">Step 4: Calculate Y Coordinate</div><p>Y coordinate is the north-south position in the equatorial plane:</p>$$ Y = (N + h) \\cdot \\cos\\phi \\cdot \\sin\\lambda = (${N.toFixed(3)} + ${h}) \\cdot \\cos${phiDeg}^\\circ \\cdot \\sin${lamDeg}^\\circ $$`);

            const Y = (N + h) * Math.cos(phi) * Math.sin(lam);
            log.push(`$$ Y = ${Y.toFixed(3)}\\text{ meters} $$<p><em>Reason: Y represents the distance north of the equatorial plane, accounting for longitude.</em></p></div>`);

            log.push(`<div class="step-container"><div class="step-title">Step 5: Calculate Z Coordinate</div><p>Z coordinate is the height above/below the equatorial plane:</p>$$ Z = [N \\cdot (1 - e^2) + h] \\cdot \\sin\\phi = [${N.toFixed(3)} \\cdot (1 - ${e2.toFixed(6)}) + ${h}] \\cdot \\sin${phiDeg}^\\circ $$`);

            const Z = (N * (1 - e2) + h) * Math.sin(phi);
            log.push(`$$ Z = ${Z.toFixed(3)}\\text{ meters} $$<p><em>Reason: Z accounts for the ellipsoidal flattening - the Earth is slightly flattened at the poles.</em></p></div>`);

            document.getElementById('outputSection').style.display = 'block';
            document.getElementById('finalResult').innerHTML = `<div class="final-answer-display"><strong>Final Answer</strong> | (X, Y, Z) = <span class="boxed-answer">(${X.toFixed(3)} m, ${Y.toFixed(3)} m, ${Z.toFixed(3)} m)</span></div>`;
            document.getElementById('explanationText').innerHTML = log.join('');
            if (window.MathJax) MathJax.typesetPromise([document.getElementById('explanationText')]);
        }
    </script>
</body>
</html>
